name: Software Engineering Methods CI

on:
  push:
  pull_request:
    branches: [develop]

jobs:
  UnitTests:
    name: Run Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # The integration tests need the database, so they run in their own job below
      - name: Run Unit Tests
        run: mvn test -Dtest='!com.napier.devops.AppIntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false

  IntegrationTests:
    name: Run Integration Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start the world database
        run: |
          docker build -t world-db ./db
          docker run --name world-db -dp 33060:3306 world-db

      # world.sql takes a while to load, so wait until the city table can be queried
      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            if docker exec world-db mysql -uroot -pexample -e "SELECT COUNT(*) FROM world.city" >/dev/null 2>&1; then
              echo "Database ready"; sleep 15; exit 0
            fi
            sleep 5
          done
          echo "Database did not start in time"; docker logs world-db; exit 1

      - name: Run Integration Tests
        run: mvn test -Dtest=com.napier.devops.AppIntegrationTest

      - name: Stop the database
        if: always()
        run: docker rm -f world-db

  Build:
    name: Build and Run with Docker Compose
    runs-on: ubuntu-22.04
    needs: [UnitTests, IntegrationTests]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Tests already ran in the jobs above, and there's no database here
      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Run Docker Compose
        run: docker compose up --abort-on-container-exit
