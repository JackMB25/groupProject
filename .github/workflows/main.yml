name: A workflow for my Hello World App
on:
  push:
  pull_request:
    branches: [develop]

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -DskipTests package
      - name: Run docker compose
        run: docker compose up --abort-on-container-exit

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Start the world database
        run: |
          docker build -t world-db ./db
          docker run --name world-db -dp 33060:3306 world-db
      - name: Wait until world.sql is loaded
        run: |
          for i in $(seq 1 60); do
            if docker exec world-db mysql -uroot -pexample -e "SELECT COUNT(*) FROM world.city" >/dev/null 2>&1; then
              echo "Database ready"; sleep 15; exit 0
            fi
            sleep 5
          done
          echo "Database did not start in time"; docker logs world-db; exit 1
      - name: Run integration tests
        run: mvn -Dtest=com.napier.devops.AppIntegrationTest test
      - name: Stop the database
        if: always()
        run: docker rm -f world-db
