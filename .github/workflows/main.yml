name: Software Engineering Methods CI

on:
  push:
  pull_request:
    branches: [develop]

jobs:
  UnitTests:
    name: Run Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test

  Build:
    name: Build and Run with Docker Compose
    runs-on: ubuntu-22.04
    needs: UnitTests

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package

      - name: Run Docker Compose
        run: docker compose up --abort-on-container-exit