name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo:4.4
          docker run -d --name mongo-dbserver --network se-methods mongo:4.4

      - name: Compile with Maven
        run: mvn compile

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run image
        run: docker run --name devopscontainer --network se-methods -d devopsimage

      - name: view logs
        run: docker logs -f devopscontainer